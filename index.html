<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plinko Dungeon - Retro Physics Pachinko Roguelike</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0e14;
      color: #e0e6ed;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 1280px;
      height: 720px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.2), 0 0 20px rgba(0, 0, 0, 0.9);
      border: 2px solid #1a2634;
      border-radius: 4px;
      background: #0f131a;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #audio-prompt {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #00f0ff;
      font-size: 14px;
      background: rgba(11, 14, 20, 0.85);
      border: 1px solid #00f0ff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.2s;
    }
    #audio-prompt:hover {
      background: #00f0ff;
      color: #0b0e14;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <button id="audio-prompt">🔊 Sound: ON</button>
</div>

<script>
// --- AUDIO SYSTEM (Web Audio API with WAV files + Synthesized Fallback) ---
const AudioEngine = {
  ctx: null,
  soundEnabled: true,
  bgmGain: null,
  sfxGain: null,
  bgmBuffer: null,
  bgmSource: null,
  sfxBuffers: {},

  init() {
    if (this.ctx) return;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AudioCtx();
    this.bgmGain = this.ctx.createGain();
    this.sfxGain = this.ctx.createGain();
    this.bgmGain.gain.value = 0.45;
    this.sfxGain.gain.value = 0.65;
    this.bgmGain.connect(this.ctx.destination);
    this.sfxGain.connect(this.ctx.destination);

    this.loadSound('bgm', 'assets/bgm_chiptune.wav', true);
    this.loadSound('move', 'assets/sfx_dropper_move.wav');
    this.loadSound('release', 'assets/sfx_orb_release.wav');
    this.loadSound('ding', 'assets/sfx_peg_ding.wav');
    this.loadSound('bomb', 'assets/sfx_bomb_explosion.wav');
    this.loadSound('jackpot', 'assets/sfx_jackpot_chime.wav');
    this.loadSound('boss_hurt', 'assets/sfx_boss_hurt.wav');
    this.loadSound('player_hurt', 'assets/sfx_player_hurt.wav');
  },

  loadSound(name, url, isBgm = false) {
    fetch(url)
      .then(res => res.arrayBuffer())
      .then(buf => this.ctx.decodeAudioData(buf))
      .then(decoded => {
        if (isBgm) {
          this.bgmBuffer = decoded;
          this.playBgm();
        } else {
          this.sfxBuffers[name] = decoded;
        }
      })
      .catch(e => {
        // Fallback: Web Audio synthesis is ready
      });
  },

  playBgm() {
    if (!this.soundEnabled || !this.bgmBuffer || !this.ctx) return;
    if (this.bgmSource) {
      try { this.bgmSource.stop(); } catch(e){}
    }
    this.bgmSource = this.ctx.createBufferSource();
    this.bgmSource.buffer = this.bgmBuffer;
    this.bgmSource.loop = true;
    this.bgmSource.connect(this.bgmGain);
    this.bgmSource.start(0);
  },

  play(name, pitch = 1.0) {
    if (!this.soundEnabled) return;
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();

    if (this.sfxBuffers[name]) {
      const src = this.ctx.createBufferSource();
      src.buffer = this.sfxBuffers[name];
      src.playbackRate.value = Math.max(0.5, Math.min(3.0, pitch));
      src.connect(this.sfxGain);
      src.start(0);
      return;
    }

    // High quality synth fallback
    this.synth(name, pitch);
  },

  synth(name, pitch) {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.sfxGain);

    if (name === 'ding') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1046.5 * pitch, now);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.start(now);
      osc.stop(now + 0.18);
    } else if (name === 'move') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(700, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
      osc.start(now);
      osc.stop(now + 0.04);
    } else if (name === 'release') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(450, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (name === 'jackpot') {
      [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, idx) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'square';
        o.frequency.value = f;
        o.connect(g);
        g.connect(this.sfxGain);
        const t = now + idx * 0.1;
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        o.start(t);
        o.stop(t + 0.18);
      });
    } else if (name === 'bomb' || name === 'boss_hurt' || name === 'player_hurt') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(name === 'bomb' ? 80 : 160, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
      gain.gain.setValueAtTime(0.6, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    }
  },

  toggleSound() {
    this.soundEnabled = !this.soundEnabled;
    const btn = document.getElementById('audio-prompt');
    if (this.soundEnabled) {
      btn.innerText = '🔊 Sound: ON';
      if (!this.ctx) this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      this.playBgm();
    } else {
      btn.innerText = '🔇 Sound: OFF';
      if (this.bgmSource) {
        try { this.bgmSource.stop(); } catch(e){}
      }
    }
  }
};

document.getElementById('audio-prompt').addEventListener('click', (e) => {
  e.stopPropagation();
  AudioEngine.toggleSound();
});

// --- ASSET LOADER ---
const ASSETS = {};
const assetList = [
  'boss1_goblin_guard.png', 'boss2_slime_brute.png', 'boss3_dragon_landlord.png',
  'bucket_0_5x_a.png', 'bucket_1_5x_a.png', 'bucket_5_0x.png', 'bucket_1_5x_b.png', 'bucket_0_5x_b.png',
  'dropper.png', 'orb_bouncy_slime.png', 'orb_heavy_boulder.png', 'orb_standard_iron.png',
  'peg_bomb_red.png', 'peg_multiplier_gold.png', 'peg_standard_white.png',
  'torch_f1.png', 'torch_f2.png', 'ui_chip.png', 'ui_heart.png',
  'wall_brick.png', 'wall_mossy.png'
];

let loadedCount = 0;
assetList.forEach(name => {
  const img = new Image();
  img.src = 'assets/' + name;
  img.onload = () => { loadedCount++; };
  ASSETS[name] = img;
});

// --- GAME STATE & CONSTANTS ---
const CANVAS = document.getElementById('gameCanvas');
const CTX = CANVAS.getContext('2d');
CTX.imageSmoothingEnabled = false;

const BOSS_CONFIGS = [
  { name: 'GOBLIN GUARD', maxHp: 60, counterDmg: 8, sprite: 'boss1_goblin_guard.png' },
  { name: 'SLIME BRUTE', maxHp: 120, counterDmg: 12, sprite: 'boss2_slime_brute.png' },
  { name: 'DRAGON LANDLORD', maxHp: 200, counterDmg: 16, sprite: 'boss3_dragon_landlord.png' }
];

const ORB_CONFIGS = {
  standard: {
    name: 'STANDARD IRON',
    desc: 'Solid balanced weight. +2 Base Damage.',
    sprite: 'orb_standard_iron.png',
    radius: 12,
    mass: 1.0,
    restitution: 0.75,
    baseDmg: 2
  },
  bouncy: {
    name: 'BOUNCY SLIME',
    desc: 'Ultra-elastic bounciness (0.95). Triggers massive combos!',
    sprite: 'orb_bouncy_slime.png',
    radius: 12,
    mass: 0.7,
    restitution: 0.95,
    baseDmg: 0
  },
  boulder: {
    name: 'HEAVY BOULDER',
    desc: 'Crushing heavy rock. Breaks through pegs for +8 Base Damage!',
    sprite: 'orb_heavy_boulder.png',
    radius: 14,
    mass: 2.5,
    restitution: 0.40,
    baseDmg: 8
  }
};

const BUCKET_DEFS = [
  { mult: 0.5, name: 'bucket_0_5x_a.png', x: 335, w: 120 },
  { mult: 1.5, name: 'bucket_1_5x_a.png', x: 457, w: 120 },
  { mult: 5.0, name: 'bucket_5_0x.png',   x: 579, w: 120, isJackpot: true },
  { mult: 1.5, name: 'bucket_1_5x_b.png', x: 701, w: 120 },
  { mult: 0.5, name: 'bucket_0_5x_b.png', x: 823, w: 120 }
];

let Game = {
  round: 0,
  playerHp: 100,
  playerMaxHp: 100,
  playerChips: 100,
  wager: 10, // 10 or 25
  activeOrb: 'standard',
  state: 'AIMING', // AIMING, DROPPING, RESOLVING, DRAFTING, GAMEOVER, VICTORY
  bossHp: 60,
  bossMaxHp: 60,

  dropperX: 640,
  dropperY: 48,
  dropperSpeed: 420,

  accumulatedDmg: 0,
  multiplier: 1,
  comboHits: 0,
  floatingTexts: [],
  particles: [],
  screenShake: 0,

  orb: null,
  pegs: [],
  bannerText: '',
  bannerTimer: 0,
  draftOptions: ['standard', 'bouncy', 'boulder'],

  keys: {},
  mousePos: { x: 640, y: 48 },

  init() {
    this.round = 0;
    this.playerHp = 100;
    this.playerChips = 100;
    this.wager = 10;
    this.activeOrb = 'standard';
    this.startRound(0);
  },

  startRound(rIdx) {
    this.round = rIdx;
    const cfg = BOSS_CONFIGS[this.round];
    this.bossHp = cfg.maxHp;
    this.bossMaxHp = cfg.maxHp;
    this.state = 'AIMING';
    this.orb = null;
    this.accumulatedDmg = 0;
    this.multiplier = 1;
    this.comboHits = 0;
    this.bannerText = '';
    this.buildPegboard();
  },

  buildPegboard() {
    this.pegs = [];
    const rows = [
      { y: 135, count: 8, startX: 380, step: 72 },
      { y: 180, count: 7, startX: 416, step: 72 },
      { y: 225, count: 8, startX: 380, step: 72 },
      { y: 270, count: 7, startX: 416, step: 72 },
      { y: 315, count: 8, startX: 380, step: 72 },
      { y: 360, count: 7, startX: 416, step: 72 },
      { y: 405, count: 8, startX: 380, step: 72 },
      { y: 450, count: 7, startX: 416, step: 72 },
      { y: 495, count: 8, startX: 380, step: 72 },
      { y: 540, count: 7, startX: 416, step: 72 }
    ];

    rows.forEach((r, rIdx) => {
      for (let c = 0; c < r.count; c++) {
        const px = r.startX + c * r.step;
        const py = r.y;
        let type = 'white';
        // Spawn tactical Bomb & Gold pegs
        if ((rIdx === 1 && c === 3) || (rIdx === 5 && (c === 1 || c === 5)) || (rIdx === 8 && c === 3)) {
          type = 'bomb';
        } else if ((rIdx % 2 === 0 && (c === 1 || c === 6)) || (rIdx === 3 && c === 3) || (rIdx === 7 && (c === 2 || c === 4))) {
          type = 'gold';
        }

        this.pegs.push({
          x: px,
          y: py,
          radius: 12,
          type: type,
          hitTime: 0,
          scale: 1.0
        });
      }
    });
  },

  dropOrb() {
    if (this.state !== 'AIMING') return;
    if (this.playerChips < this.wager) {
      this.spawnFloatingText("NOT ENOUGH CHIPS!", 640, 200, '#ff4444');
      return;
    }

    this.playerChips -= this.wager;
    const cfg = ORB_CONFIGS[this.activeOrb];
    this.accumulatedDmg = cfg.baseDmg;
    this.multiplier = 1;
    this.comboHits = 0;

    this.orb = {
      x: this.dropperX,
      y: this.dropperY + 36,
      vx: (Math.random() - 0.5) * 40,
      vy: 60,
      radius: cfg.radius,
      mass: cfg.mass,
      restitution: cfg.restitution,
      type: this.activeOrb
    };

    this.state = 'DROPPING';
    AudioEngine.play('release');
  },

  onPegCollision(peg) {
    peg.hitTime = 0.35;
    this.comboHits++;
    const pitch = Math.min(2.5, 0.9 + this.comboHits * 0.08);

    if (peg.type === 'white') {
      this.accumulatedDmg += 2;
      this.spawnFloatingText('+2 DMG', peg.x, peg.y - 12, '#ffffff');
      this.spawnParticles(peg.x, peg.y, '#00f0ff', 6);
      AudioEngine.play('ding', pitch);
    } else if (peg.type === 'gold') {
      this.multiplier *= 2;
      this.spawnFloatingText('2x MULTIPLIER!', peg.x, peg.y - 12, '#ffd700');
      this.spawnParticles(peg.x, peg.y, '#ffd700', 12);
      AudioEngine.play('ding', 1.8);
    } else if (peg.type === 'bomb') {
      this.accumulatedDmg += 10;
      this.screenShake = 12;
      this.spawnFloatingText('BOOM! +10 DMG', peg.x, peg.y - 12, '#ff4444');
      this.spawnParticles(peg.x, peg.y, '#ff4444', 20);
      AudioEngine.play('bomb');

      // Knock back orb with explosion force
      const dx = this.orb.x - peg.x;
      const dy = this.orb.y - peg.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      this.orb.vx += (dx / dist) * 350;
      this.orb.vy += (dy / dist) * 350;
    }
  },

  resolveBucket(bucket) {
    this.state = 'RESOLVING';
    const totalDmg = Math.round(this.accumulatedDmg * this.multiplier * bucket.mult);
    const chipsWon = Math.round(this.wager * bucket.mult);
    this.playerChips += chipsWon;

    if (bucket.isJackpot) {
      this.screenShake = 18;
      this.bannerText = '5.0x JACKPOT!';
      this.bannerTimer = 2.5;
      this.spawnParticles(640, 640, '#ffd700', 50);
      AudioEngine.play('jackpot');
    } else {
      this.bannerText = `${bucket.mult}x BUCKET!`;
      this.bannerTimer = 1.8;
      AudioEngine.play('ding', 1.2);
    }

    this.spawnFloatingText(`+$${chipsWon}`, bucket.x + 60, 620, '#ffd700');

    // Boss damage sequence
    setTimeout(() => {
      this.bossHp = Math.max(0, this.bossHp - totalDmg);
      this.screenShake = 8;
      this.spawnFloatingText(`-${totalDmg} DMG!`, 160, 280, '#ff4444');
      AudioEngine.play('boss_hurt');

      setTimeout(() => {
        if (this.bossHp <= 0) {
          this.onBossDefeated();
        } else {
          // Boss counter attacks!
          const bossCfg = BOSS_CONFIGS[this.round];
          this.playerHp = Math.max(0, this.playerHp - bossCfg.counterDmg);
          this.screenShake = 10;
          this.spawnFloatingText(`-${bossCfg.counterDmg} HP!`, 1120, 100, '#ff2222');
          AudioEngine.play('player_hurt');

          setTimeout(() => {
            if (this.playerHp <= 0 || this.playerChips < 10) {
              this.state = 'GAMEOVER';
            } else {
              this.state = 'AIMING';
              this.orb = null;
            }
          }, 800);
        }
      }, 700);
    }, 600);
  },

  onBossDefeated() {
    if (this.round >= 2) {
      this.state = 'VICTORY';
      AudioEngine.play('jackpot');
    } else {
      this.state = 'DRAFTING';
      this.orb = null;
    }
  },

  selectDraftOrb(type) {
    this.activeOrb = type;
    this.spawnFloatingText(`DRAFTED: ${ORB_CONFIGS[type].name}!`, 640, 360, '#00f0ff');
    AudioEngine.play('jackpot');
    setTimeout(() => {
      this.startRound(this.round + 1);
    }, 700);
  },

  spawnFloatingText(txt, x, y, col) {
    this.floatingTexts.push({
      text: txt,
      x: x,
      y: y,
      color: col,
      alpha: 1.0,
      vy: -40
    });
  },

  spawnParticles(x, y, col, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 40 + Math.random() * 180;
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: col,
        life: 0.5 + Math.random() * 0.5,
        maxLife: 1.0,
        size: 3 + Math.random() * 4
      });
    }
  }
};

// --- CONTROLS / INPUT ---
window.addEventListener('keydown', (e) => {
  Game.keys[e.code] = true;
  if (!AudioEngine.ctx) AudioEngine.init();

  if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
    AudioEngine.play('move');
  }
  if (e.code === 'KeyD' || e.code === 'ArrowRight') {
    AudioEngine.play('move');
  }
  if (e.code === 'Digit1') {
    Game.wager = 10;
    AudioEngine.play('move');
  }
  if (e.code === 'Digit2') {
    Game.wager = 25;
    AudioEngine.play('move');
  }
  if (e.code === 'Space') {
    if (Game.state === 'AIMING') {
      Game.dropOrb();
    } else if (Game.state === 'GAMEOVER' || Game.state === 'VICTORY') {
      Game.init();
    }
  }
});

window.addEventListener('keyup', (e) => {
  Game.keys[e.code] = false;
});

CANVAS.addEventListener('mousemove', (e) => {
  const rect = CANVAS.getBoundingClientRect();
  const scaleX = CANVAS.width / rect.width;
  const scaleY = CANVAS.height / rect.height;
  Game.mousePos.x = (e.clientX - rect.left) * scaleX;
  Game.mousePos.y = (e.clientY - rect.top) * scaleY;

  if (Game.state === 'AIMING') {
    Game.dropperX = Math.max(370, Math.min(910, Game.mousePos.x));
  }
});

CANVAS.addEventListener('mousedown', (e) => {
  if (!AudioEngine.ctx) AudioEngine.init();
  const rect = CANVAS.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (CANVAS.width / rect.width);
  const my = (e.clientY - rect.top) * (CANVAS.height / rect.height);

  // Click on Wager Buttons
  if (mx >= 1000 && mx <= 1240 && my >= 280 && my <= 330) {
    Game.wager = 10;
    AudioEngine.play('move');
    return;
  }
  if (mx >= 1000 && mx <= 1240 && my >= 340 && my <= 390) {
    Game.wager = 25;
    AudioEngine.play('move');
    return;
  }

  // Click Draft Cards
  if (Game.state === 'DRAFTING') {
    const cardW = 180, cardH = 240, cardY = 280;
    const cards = [
      { type: 'standard', x: 340 },
      { type: 'bouncy', x: 550 },
      { type: 'boulder', x: 760 }
    ];
    for (let c of cards) {
      if (mx >= c.x && mx <= c.x + cardW && my >= cardY && my <= cardY + cardH) {
        Game.selectDraftOrb(c.type);
        return;
      }
    }
  }

  // Click Game Over / Victory restart
  if (Game.state === 'GAMEOVER' || Game.state === 'VICTORY') {
    if (mx >= 480 && mx <= 800 && my >= 440 && my <= 510) {
      Game.init();
      return;
    }
  }

  // Drop Orb on Playfield Click
  if (Game.state === 'AIMING' && mx >= 325 && mx <= 955) {
    Game.dropOrb();
  }
});

// --- PHYSICS UPDATE ---
function updatePhysics(dt) {
  // Update Dropper via keys
  if (Game.state === 'AIMING') {
    if (Game.keys['ArrowLeft'] || Game.keys['KeyA']) {
      Game.dropperX = Math.max(370, Game.dropperX - Game.dropperSpeed * dt);
    }
    if (Game.keys['ArrowRight'] || Game.keys['KeyD']) {
      Game.dropperX = Math.min(910, Game.dropperX + Game.dropperSpeed * dt);
    }
  }

  // Update Orb Physics
  if (Game.orb && (Game.state === 'DROPPING' || Game.state === 'RESOLVING')) {
    const orb = Game.orb;
    const gravity = 880; // px/s^2

    orb.vy += gravity * dt;
    orb.x += orb.vx * dt;
    orb.y += orb.vy * dt;

    // Wall bounce
    if (orb.x - orb.radius < 330) {
      orb.x = 330 + orb.radius;
      orb.vx = -orb.vx * 0.6;
    }
    if (orb.x + orb.radius > 950) {
      orb.x = 950 - orb.radius;
      orb.vx = -orb.vx * 0.6;
    }

    // Peg Collisions
    Game.pegs.forEach(peg => {
      const dx = orb.x - peg.x;
      const dy = orb.y - peg.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = orb.radius + peg.radius;

      if (dist < minDist) {
        // Resolve overlap
        const nx = dx / (dist || 1);
        const ny = dy / (dist || 1);
        const overlap = minDist - dist;
        orb.x += nx * overlap;
        orb.y += ny * overlap;

        // Velocity bounce calculation
        const dot = orb.vx * nx + orb.vy * ny;
        if (dot < 0) {
          const impulse = -(1 + orb.restitution) * dot;
          orb.vx += nx * impulse;
          orb.vy += ny * impulse;

          // Add slight chaotic jitter
          orb.vx += (Math.random() - 0.5) * 30;
          Game.onPegCollision(peg);
        }
      }
    });

    // Bucket Dividers collision (dividers at x=454, 576, 698, 820)
    [454, 576, 698, 820].forEach(divX => {
      if (orb.y > 590 && orb.y < 710) {
        if (Math.abs(orb.x - divX) < orb.radius + 4) {
          orb.vx = (orb.x < divX ? -1 : 1) * 80;
        }
      }
    });

    // Bucket landing detection
    if (orb.y >= 640 && Game.state === 'DROPPING') {
      let landedBucket = null;
      for (let b of BUCKET_DEFS) {
        if (orb.x >= b.x && orb.x <= b.x + b.w) {
          landedBucket = b;
          break;
        }
      }
      if (!landedBucket) landedBucket = BUCKET_DEFS[0]; // fallback
      Game.resolveBucket(landedBucket);
    }
  }

  // Peg animation decay
  Game.pegs.forEach(p => {
    if (p.hitTime > 0) {
      p.hitTime -= dt;
      p.scale = 1.0 + Math.max(0, p.hitTime * 1.5);
    } else {
      p.scale = 1.0;
    }
  });

  // Floating text decay
  for (let i = Game.floatingTexts.length - 1; i >= 0; i--) {
    const ft = Game.floatingTexts[i];
    ft.y += ft.vy * dt;
    ft.alpha -= dt * 0.8;
    if (ft.alpha <= 0) Game.floatingTexts.splice(i, 1);
  }

  // Particle decay
  for (let i = Game.particles.length - 1; i >= 0; i--) {
    const p = Game.particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;
    p.life -= dt;
    if (p.life <= 0) Game.particles.splice(i, 1);
  }

  // Screen shake decay
  if (Game.screenShake > 0) {
    Game.screenShake = Math.max(0, Game.screenShake - dt * 25);
  }

  // Banner timer
  if (Game.bannerTimer > 0) {
    Game.bannerTimer -= dt;
    if (Game.bannerTimer <= 0) Game.bannerText = '';
  }
}

// --- RENDER SYSTEM ---
let animTime = 0;
function render() {
  CTX.save();

  // Screen Shake Offset
  if (Game.screenShake > 0) {
    const ox = (Math.random() - 0.5) * Game.screenShake;
    const oy = (Math.random() - 0.5) * Game.screenShake;
    CTX.translate(ox, oy);
  }

  // 1. Clear & Background
  CTX.fillStyle = '#0f131a';
  CTX.fillRect(0, 0, 1280, 720);

  // Background Dungeon Walls on Left & Right
  const brickImg = ASSETS['wall_brick.png'];
  const mossyImg = ASSETS['wall_mossy.png'];
  for (let y = 0; y < 720; y += 32) {
    for (let x = 0; x < 320; x += 32) {
      const tile = ((x + y) % 64 === 0 && mossyImg) ? mossyImg : brickImg;
      if (tile && tile.complete) CTX.drawImage(tile, x, y, 32, 32);
    }
    for (let x = 960; x < 1280; x += 32) {
      const tile = ((x + y) % 64 === 0 && mossyImg) ? mossyImg : brickImg;
      if (tile && tile.complete) CTX.drawImage(tile, x, y, 32, 32);
    }
  }

  // Dungeon Ambient Dark Vignette
  CTX.fillStyle = 'rgba(11, 14, 20, 0.45)';
  CTX.fillRect(0, 0, 320, 720);
  CTX.fillRect(960, 0, 320, 720);

  // Torches (flicker between f1 and f2)
  const torchImg = Math.floor(animTime * 6) % 2 === 0 ? ASSETS['torch_f1.png'] : ASSETS['torch_f2.png'];
  if (torchImg && torchImg.complete) {
    CTX.drawImage(torchImg, 235, 120, 32, 32);
    CTX.drawImage(torchImg, 235, 460, 32, 32);
    CTX.drawImage(torchImg, 990, 120, 32, 32);
    CTX.drawImage(torchImg, 990, 460, 32, 32);
  }

  // 2. Center Playfield Border (Neon Cyan)
  CTX.fillStyle = '#090c10';
  CTX.fillRect(325, 0, 630, 720);

  CTX.strokeStyle = '#00f0ff';
  CTX.lineWidth = 3;
  CTX.shadowColor = '#00f0ff';
  CTX.shadowBlur = 10;
  CTX.strokeRect(325, 0, 630, 720);
  CTX.shadowBlur = 0;

  // 3. Pegboard Pegs
  Game.pegs.forEach(peg => {
    let img = ASSETS['peg_standard_white.png'];
    if (peg.type === 'gold') img = ASSETS['peg_multiplier_gold.png'];
    if (peg.type === 'bomb') img = ASSETS['peg_bomb_red.png'];

    CTX.save();
    CTX.translate(peg.x, peg.y);
    CTX.scale(peg.scale, peg.scale);

    if (img && img.complete) {
      CTX.drawImage(img, -16, -16, 32, 32);
    } else {
      CTX.fillStyle = peg.type === 'gold' ? '#ffd700' : (peg.type === 'bomb' ? '#ff4444' : '#ffffff');
      CTX.beginPath();
      CTX.arc(0, 0, peg.radius, 0, Math.PI * 2);
      CTX.fill();
    }
    CTX.restore();
  });

  // 4. Bottom Buckets
  BUCKET_DEFS.forEach(b => {
    const img = ASSETS[b.name];
    if (img && img.complete) {
      CTX.drawImage(img, b.x, 620, b.w, 100);
    } else {
      CTX.fillStyle = b.isJackpot ? '#ffd700' : (b.mult === 1.5 ? '#7b2cbf' : '#b7094c');
      CTX.fillRect(b.x, 620, b.w, 100);
      CTX.fillStyle = '#ffffff';
      CTX.font = 'bold 22px monospace';
      CTX.textAlign = 'center';
      CTX.fillText(`${b.mult}x`, b.x + b.w / 2, 675);
    }
  });

  // Bucket Dividers
  CTX.fillStyle = '#4a5568';
  [454, 576, 698, 820].forEach(dx => {
    CTX.fillRect(dx - 3, 610, 6, 110);
  });

  // 5. Dropper & Aim Line
  if (Game.state === 'AIMING') {
    // Dotted aim guide
    CTX.strokeStyle = 'rgba(0, 240, 255, 0.4)';
    CTX.lineWidth = 2;
    CTX.setLineDash([6, 8]);
    CTX.beginPath();
    CTX.moveTo(Game.dropperX, Game.dropperY + 32);
    CTX.lineTo(Game.dropperX, 620);
    CTX.stroke();
    CTX.setLineDash([]);
  }

  // Dropper Sprite
  const dropperImg = ASSETS['dropper.png'];
  if (dropperImg && dropperImg.complete) {
    CTX.drawImage(dropperImg, Game.dropperX - 24, Game.dropperY - 16, 48, 48);
  } else {
    CTX.fillStyle = '#00f0ff';
    CTX.fillRect(Game.dropperX - 16, Game.dropperY, 32, 32);
  }

  // 6. Active Orb
  if (Game.orb) {
    const orb = Game.orb;
    const cfg = ORB_CONFIGS[orb.type];
    const orbImg = ASSETS[cfg.sprite];
    if (orbImg && orbImg.complete) {
      CTX.drawImage(orbImg, orb.x - orb.radius, orb.y - orb.radius, orb.radius * 2, orb.radius * 2);
    } else {
      CTX.fillStyle = orb.type === 'bouncy' ? '#00ff88' : (orb.type === 'boulder' ? '#888888' : '#e0e6ed');
      CTX.beginPath();
      CTX.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);
      CTX.fill();
    }
  }

  // 7. Particles
  Game.particles.forEach(p => {
    CTX.fillStyle = p.color;
    CTX.globalAlpha = Math.max(0, p.life / p.maxLife);
    CTX.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  });
  CTX.globalAlpha = 1.0;

  // 8. LEFT PANEL (Boss & Round)
  CTX.textAlign = 'left';
  CTX.fillStyle = '#00f0ff';
  CTX.font = 'bold 24px monospace';
  CTX.fillText('PLINKO DUNGEON', 24, 45);

  CTX.fillStyle = '#ffd700';
  CTX.font = 'bold 18px monospace';
  CTX.fillText(`ROUND ${Game.round + 1} / 3`, 24, 75);

  const bossCfg = BOSS_CONFIGS[Game.round];
  CTX.fillStyle = '#ffffff';
  CTX.font = 'bold 20px monospace';
  CTX.fillText(bossCfg.name, 24, 110);

  // Boss Portrait (32x32 scaled up to 180x180)
  const bossImg = ASSETS[bossCfg.sprite];
  if (bossImg && bossImg.complete) {
    CTX.drawImage(bossImg, 70, 140, 180, 180);
  }

  // Boss HP Bar
  const hpPercent = Math.max(0, Game.bossHp / Game.bossMaxHp);
  CTX.strokeStyle = '#ffffff';
  CTX.lineWidth = 2;
  CTX.strokeRect(30, 340, 260, 24);
  CTX.fillStyle = '#ff3344';
  CTX.fillRect(32, 342, 256 * hpPercent, 20);

  CTX.fillStyle = '#ffffff';
  CTX.font = 'bold 16px monospace';
  CTX.textAlign = 'center';
  CTX.fillText(`HP ${Game.bossHp} / ${Game.bossMaxHp}`, 160, 358);

  // Counter-Strike Notice
  CTX.textAlign = 'left';
  CTX.fillStyle = '#ff9900';
  CTX.font = 'bold 15px monospace';
  CTX.fillText(`COUNTER-STRIKE: ${bossCfg.counterDmg} DMG`, 30, 395);

  // Round Tally Stats
  CTX.fillStyle = '#8899aa';
  CTX.font = '14px monospace';
  CTX.fillText(`DROP DMG: ${Game.accumulatedDmg}`, 30, 430);
  CTX.fillText(`MULTIPLIER: ${Game.multiplier}x`, 30, 455);

  // 9. RIGHT PANEL (Player Stats, Wager, Active Orb)
  CTX.textAlign = 'left';

  // Player HP
  const heartImg = ASSETS['ui_heart.png'];
  if (heartImg && heartImg.complete) {
    CTX.drawImage(heartImg, 990, 40, 36, 36);
  }
  CTX.fillStyle = '#ff4444';
  CTX.font = 'bold 24px monospace';
  CTX.fillText(`${Game.playerHp} / 100 HP`, 1040, 68);

  // Player Chips
  const chipImg = ASSETS['ui_chip.png'];
  if (chipImg && chipImg.complete) {
    CTX.drawImage(chipImg, 990, 100, 36, 36);
  }
  CTX.fillStyle = '#ffd700';
  CTX.font = 'bold 28px monospace';
  CTX.fillText(`$ ${Game.playerChips}`, 1040, 130);

  // Wager Selection Buttons
  // Ante $10
  const isAnte10 = Game.wager === 10;
  CTX.strokeStyle = isAnte10 ? '#00f0ff' : '#4a5568';
  CTX.fillStyle = isAnte10 ? 'rgba(0, 240, 255, 0.2)' : 'rgba(20, 25, 35, 0.7)';
  CTX.lineWidth = isAnte10 ? 3 : 1;
  CTX.fillRect(1000, 280, 240, 45);
  CTX.strokeRect(1000, 280, 240, 45);
  CTX.fillStyle = isAnte10 ? '#00f0ff' : '#a0aec0';
  CTX.font = 'bold 18px monospace';
  CTX.textAlign = 'center';
  CTX.fillText('[1] ANTE $10' + (isAnte10 ? ' ★' : ''), 1120, 310);

  // High Roller $25
  const isAnte25 = Game.wager === 25;
  CTX.strokeStyle = isAnte25 ? '#ff3344' : '#4a5568';
  CTX.fillStyle = isAnte25 ? 'rgba(255, 51, 68, 0.2)' : 'rgba(20, 25, 35, 0.7)';
  CTX.lineWidth = isAnte25 ? 3 : 1;
  CTX.fillRect(1000, 340, 240, 45);
  CTX.strokeRect(1000, 340, 240, 45);
  CTX.fillStyle = isAnte25 ? '#ff4444' : '#a0aec0';
  CTX.fillText('[2] HIGH ROLLER $25' + (isAnte25 ? ' ★' : ''), 1120, 370);

  // Active Orb Display
  CTX.textAlign = 'left';
  const curOrb = ORB_CONFIGS[Game.activeOrb];
  CTX.fillStyle = '#ffffff';
  CTX.font = 'bold 15px monospace';
  CTX.fillText(`ACTIVE ORB:`, 1000, 430);

  const activeOrbImg = ASSETS[curOrb.sprite];
  if (activeOrbImg && activeOrbImg.complete) {
    CTX.drawImage(activeOrbImg, 1000, 445, 36, 36);
  }
  CTX.fillStyle = '#00f0ff';
  CTX.font = 'bold 16px monospace';
  CTX.fillText(curOrb.name, 1045, 470);

  // Controls Helper
  CTX.fillStyle = '#718096';
  CTX.font = '13px monospace';
  CTX.fillText('CONTROLS:', 1000, 560);
  CTX.fillText('• [A][D] or MOUSE : Aim', 1000, 585);
  CTX.fillText('• [SPACE] or CLICK : Drop', 1000, 610);
  CTX.fillText('• [1][2] : Select Wager', 1000, 635);

  // 10. Floating Texts
  Game.floatingTexts.forEach(ft => {
    CTX.fillStyle = ft.color;
    CTX.globalAlpha = Math.max(0, ft.alpha);
    CTX.font = 'bold 20px monospace';
    CTX.textAlign = 'center';
    CTX.fillText(ft.text, ft.x, ft.y);
  });
  CTX.globalAlpha = 1.0;

  // 11. Center Jackpot / Resolution Banner
  if (Game.bannerText) {
    CTX.fillStyle = 'rgba(11, 14, 20, 0.85)';
    CTX.fillRect(420, 260, 440, 70);
    CTX.strokeStyle = '#ffd700';
    CTX.lineWidth = 3;
    CTX.strokeRect(420, 260, 440, 70);

    CTX.fillStyle = '#ffd700';
    CTX.font = 'bold 32px monospace';
    CTX.textAlign = 'center';
    CTX.fillText(Game.bannerText, 640, 308);
  }

  // 12. DRAFT OVERLAY (Between Rounds)
  if (Game.state === 'DRAFTING') {
    CTX.fillStyle = 'rgba(9, 12, 16, 0.92)';
    CTX.fillRect(0, 0, 1280, 720);

    CTX.fillStyle = '#ffd700';
    CTX.font = 'bold 36px monospace';
    CTX.textAlign = 'center';
    CTX.fillText('🏆 BOSS SLAIN! SELECT REWARD ORB 🏆', 640, 160);

    CTX.fillStyle = '#a0aec0';
    CTX.font = '18px monospace';
    CTX.fillText('Choose 1 kinetic orb to bolster your arsenal for the next dungeon floor:', 640, 200);

    const cards = [
      { key: 'standard', cfg: ORB_CONFIGS.standard, x: 320 },
      { key: 'bouncy',   cfg: ORB_CONFIGS.bouncy,   x: 550 },
      { key: 'boulder',  cfg: ORB_CONFIGS.boulder,  x: 780 }
    ];

    cards.forEach(c => {
      const isCur = Game.activeOrb === c.key;
      CTX.fillStyle = isCur ? 'rgba(0, 240, 255, 0.15)' : 'rgba(26, 32, 44, 0.8)';
      CTX.strokeStyle = isCur ? '#00f0ff' : '#4a5568';
      CTX.lineWidth = isCur ? 3 : 2;
      CTX.fillRect(c.x, 260, 180, 240);
      CTX.strokeRect(c.x, 260, 180, 240);

      const oImg = ASSETS[c.cfg.sprite];
      if (oImg && oImg.complete) {
        CTX.drawImage(oImg, c.x + 66, 285, 48, 48);
      }

      CTX.fillStyle = '#ffffff';
      CTX.font = 'bold 15px monospace';
      CTX.textAlign = 'center';
      CTX.fillText(c.cfg.name, c.x + 90, 360);

      CTX.fillStyle = '#a0aec0';
      CTX.font = '12px monospace';
      // Word wrap description
      const words = c.cfg.desc.split(' ');
      let line = '';
      let ly = 390;
      words.forEach(w => {
        if ((line + w).length > 18) {
          CTX.fillText(line, c.x + 90, ly);
          line = w + ' ';
          ly += 16;
        } else {
          line += w + ' ';
        }
      });
      if (line) CTX.fillText(line, c.x + 90, ly);

      CTX.fillStyle = '#00f0ff';
      CTX.font = 'bold 14px monospace';
      CTX.fillText('[ CLICK TO EQUIP ]', c.x + 90, 480);
    });
  }

  // 13. GAME OVER OVERLAY
  if (Game.state === 'GAMEOVER') {
    CTX.fillStyle = 'rgba(9, 12, 16, 0.94)';
    CTX.fillRect(0, 0, 1280, 720);

    CTX.fillStyle = '#ff2222';
    CTX.font = 'bold 44px monospace';
    CTX.textAlign = 'center';
    CTX.fillText('💀 YOU PERISHED IN THE DUNGEON 💀', 640, 260);

    CTX.fillStyle = '#cbd5e0';
    CTX.font = '20px monospace';
    if (Game.playerHp <= 0) {
      CTX.fillText('Your health was depleted by the boss counter-attack.', 640, 320);
    } else {
      CTX.fillText('You ran out of chips ($0) and could not afford the minimum ante.', 640, 320);
    }

    // Restart Button
    CTX.fillStyle = '#ff2222';
    CTX.fillRect(480, 420, 320, 60);
    CTX.strokeStyle = '#ffffff';
    CTX.lineWidth = 2;
    CTX.strokeRect(480, 420, 320, 60);

    CTX.fillStyle = '#ffffff';
    CTX.font = 'bold 24px monospace';
    CTX.fillText('PLAY AGAIN [SPACE]', 640, 458);
  }

  // 14. VICTORY OVERLAY
  if (Game.state === 'VICTORY') {
    CTX.fillStyle = 'rgba(9, 12, 16, 0.94)';
    CTX.fillRect(0, 0, 1280, 720);

    CTX.fillStyle = '#ffd700';
    CTX.font = 'bold 44px monospace';
    CTX.textAlign = 'center';
    CTX.fillText('👑 DUNGEON CONQUERED! 👑', 640, 240);

    CTX.fillStyle = '#00f0ff';
    CTX.font = 'bold 22px monospace';
    CTX.fillText('All 3 Bosses vanquished! The Dragon Landlord has fallen!', 640, 300);

    CTX.fillStyle = '#ffd700';
    CTX.font = '24px monospace';
    CTX.fillText(`FINAL CHIPS TREASURE: $${Game.playerChips}`, 640, 350);

    // Restart Button
    CTX.fillStyle = '#00f0ff';
    CTX.fillRect(480, 420, 320, 60);
    CTX.strokeStyle = '#ffffff';
    CTX.lineWidth = 2;
    CTX.strokeRect(480, 420, 320, 60);

    CTX.fillStyle = '#0b0e14';
    CTX.font = 'bold 24px monospace';
    CTX.fillText('PLAY AGAIN [SPACE]', 640, 458);
  }

  CTX.restore();
}

// --- MAIN LOOP ---
let lastTime = performance.now();
function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  animTime += dt;

  updatePhysics(dt);
  render();

  requestAnimationFrame(gameLoop);
}

// Start Game
Game.init();
requestAnimationFrame(gameLoop);
</script>
